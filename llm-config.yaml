# LLM 配置文件 — 为不同任务配置不同的模型和参数
# 实际当前版本由环境变量控制；YAML 层可供未来多模型路由扩展用

defaults:
  model: gpt-4o
  temperature: 0.2
  max_tokens: 4096
  timeout_ms: 60000
  max_retries: 3

tasks:
  # 文档解析（AST 构建）
  parse:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 2048
    description: 解析文档结构，识别标题、摘要、关键词等块类型

  # AI 对话修订指令解析
  revise:
    model: gpt-4o
    temperature: 0.3
    max_tokens: 1024
    description: 解析用户自然语言修订指令，输出结构化 patch

  # 安全闸分析
  safety:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 512
    description: 文本一致性安全检查

  # QA 报告生成
  qa:
    model: gpt-4o-mini
    temperature: 0.1
    max_tokens: 2048
    description: 生成格式体检报告

  # 模板分析
  template_analysis:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 2048
    description: 从 DOCX 模板 OpenXML 提取格式配置草稿

models:
  gpt-4o:
    provider: openai
    context_window: 128000
    supports_json_mode: true

  gpt-4o-mini:
    provider: openai
    context_window: 128000
    supports_json_mode: true

  # 备选本地模型（需要 Ollama 或兼容 OpenAI API 的服务）
  qwen2.5-72b-instruct:
    provider: compatible
    context_window: 32000
    supports_json_mode: false
    notes: 需要在 .env 中设置 OPENAI_BASE_URL 指向局域推理服务